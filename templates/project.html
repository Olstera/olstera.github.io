<!doctype html>
<!-- Generated by tools/build_projects.py. Edit templates/ and content/. -->
<html lang="ru" class="archive-page case-page">
  $head
  <body>
    <a class="skip-link" href="#main">Перейти к содержимому</a>
    $sidebar
    <main id="main">
      <article class="case section" id="project" aria-labelledby="case-title">
        <header class="case-heading">
          <div class="catalog-topline">
            <a class="text-link" href="projects.html">Все проекты</a>
            <span>$index / $total</span>
          </div>
          <h1 id="case-title">$name</h1>
          <div class="case-summary">
            <dl class="case-facts">
              <div><dt>Направление</dt><dd><span class="project-type">$type</span></dd></div>
              <div><dt>Моя роль</dt><dd>$role</dd></div>
            </dl>
            <div class="case-intro">
              <p class="text-h4">$description.</p>
              <p class="case-description case-body">$intro</p>
            </div>
          </div>
        </header>
        <div class="case-blocks">
          $blocks
        </div>
        <nav class="case-pagination" aria-label="Другие проекты">
          <a class="next-project" href="$next_url">
            <span class="next-project-label">Следующий проект</span>
            <span class="next-project-name">$next_name <span aria-hidden="true">↗</span></span>
          </a>
          <a class="outline-hover-button" href="projects.html">Все проекты <span aria-hidden="true">↗</span></a>
        </nav>
      </article>
      $footer
    </main>
    <dialog class="image-viewer" aria-labelledby="viewer-title" aria-describedby="viewer-help">
      <div class="viewer-toolbar">
        <div class="viewer-heading">
          <p id="viewer-title"></p>
          <p id="viewer-help">Прокручивайте, чтобы посмотреть целиком.</p>
        </div>
        <button class="viewer-control viewer-zoom" type="button" aria-pressed="false">Масштаб 100%</button>
        <button class="viewer-control viewer-close" type="button" aria-label="Закрыть изображение" autofocus><span aria-hidden="true">×</span></button>
      </div>
      <div class="viewer-scroll" tabindex="0" role="region" aria-label="Изображение проекта, область прокрутки">
        <img class="viewer-image" alt="">
      </div>
    </dialog>
  </body>
</html>
