<article class="project$card_class">
  <a class="project-cover $cover_class" href="$url" aria-label="Смотреть проект $name">
    <img $image_attributes>
  </a>
  <div class="project-info">
    <div><h3><a href="$url">$name</a></h3><p>$description</p></div>
    <span class="project-type">$type</span>
  </div>
</article>
