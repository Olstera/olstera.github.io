<article class="catalog-card$card_class" aria-labelledby="project-$index-title">
  <a class="catalog-cover $cover_class" href="$url" aria-label="Смотреть проект $name">
    <img $image_attributes>
  </a>
  <div class="catalog-info">
    <span class="catalog-index" aria-hidden="true">$display_index /</span>
    <h2 id="project-$index-title"><a href="$url">$name</a></h2>
    <p>$description</p>
    <span class="project-type">$type</span>
  </div>
</article>
